<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/album.css' | relative_url }}">
</head>
<body>
  <header class="page-header" role="banner">
    <a href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/logoPGM2026.png' | relative_url }}" alt="PGM 2026 València logo" class="site-logo">
    </a>
    <h1 class="project-name">{{ page.title | default: site.title }}</h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
  </header>

  <main id="content" class="main-content" role="main">
    {{ content }}

    <footer class="site-footer">
      <span class="site-footer-credits">PGM 2026 – Conference Diary · Valencia, Spain · September 8–11, 2026</span>
    </footer>
  </main>

  <script src="{{ '/assets/js/album.js' | relative_url }}" defer></script>
</body>
</html>
